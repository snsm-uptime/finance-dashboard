# ===== HOW TO USE THIS FILE =====
#
# 1. UPDATE STATUS AS YOU WORK:
#    - Change status: backlog → in-progress (when you start)
#    - Set date_started when you begin
#    - Update commit_sha and commit_message when merged
#    - Change status to done when complete
#    - Set date_completed when finished
#    - Add blockers: ["reason"] if stuck
#
# 2. RESUMING IN A NEW CHAT:
#    - Show this file to me at the start
#    - I'll see which tickets are done/in-progress/blocked
#    - We'll pick up where you left off
#
# 3. EXAMPLE UPDATE:
#    Before:
#      status: backlog
#      date_started: null
#
#    After working:
#      status: done
#      commit_sha: "a1b2c3d"
#      commit_message: "refactor: extract useModalAnimation hook"
#      date_started: 2026-08-12
#      date_completed: 2026-08-12
#
# 4. BLOCKERS:
#    If stuck, add to blockers list:
#      blockers: ["TypeScript error in X", "Need clarification on Y"]
#    Then we'll debug together in next session.

