name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance_ci
          POSTGRES_DB: finance_helper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_helper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://finance:finance_ci@localhost:5432/finance_helper
      SESSION_SECRET: ci-session-secret-not-for-prod
      SESSION_COOKIE_SECURE: "false"
      EMAIL_VERIFICATION_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: api/.python-version
      - name: Install
        run: uv sync --group dev
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  ui:
    name: ui lint, typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage floor
        run: npm run test:coverage
